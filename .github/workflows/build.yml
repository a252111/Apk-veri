name: APK derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Proje dosyalarini olustur
        run: |
          set -e
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'__END0__'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google(); mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "MuzikTelefon"
          include(":app")
          __END0__
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'__END1__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __END1__
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'__END2__'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          __END2__
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'__END3__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rqtm.muzik"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.rqtm.muzik"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { jniLibs { useLegacyPackaging = true } }
          }

          dependencies {
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.2")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2")
          }
          __END3__
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'__END4__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="موسيقى الهاتف"
                  android:supportsRtl="true"
                  android:icon="@android:drawable/ic_media_play"
                  android:extractNativeLibs="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".PollService" android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          __END4__
          mkdir -p "$(dirname 'app/src/main/java/com/rqtm/muzik/LocalMusic.kt')"
          cat > 'app/src/main/java/com/rqtm/muzik/LocalMusic.kt' <<'__END5__'
          package com.rqtm.muzik

          import android.content.Context
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import org.json.JSONObject
          import java.io.DataOutputStream
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.UUID

          /** Arama + indirme + MP3 çevirme TELEFONDA yapılır. Bota sadece bitmiş MP3 yüklenir. */
          object LocalMusic {
              private var ready = false

              @Synchronized
              fun init(ctx: Context) {
                  if (ready) return
                  YoutubeDL.getInstance().init(ctx.applicationContext)
                  FFmpeg.getInstance().init(ctx.applicationContext)
                  ready = true
              }

              private var lastUpdate = 0L

              /** yt-dlp'yi günceller (YouTube sık değişir). minGapMs: en son güncellemeden bu yana geçmesi gereken süre. */
              @Synchronized
              fun updateYtDlp(ctx: Context, minGapMs: Long) {
                  if (System.currentTimeMillis() - lastUpdate < minGapMs) return
                  lastUpdate = System.currentTimeMillis()
                  try {
                      init(ctx)
                      YoutubeDL.getInstance().updateYoutubeDL(ctx.applicationContext)
                  } catch (_: Throwable) { }
              }

              data class Song(val url: String, val title: String, val uploader: String,
                              val duration: Int, val thumb: String)

              private fun searchOne(prefix: String, q: String, flat: Boolean): List<Song> {
                  val out = ArrayList<Song>()
                  try {
                      val req = YoutubeDLRequest("$prefix:$q")
                      if (flat) req.addOption("--flat-playlist")
                      req.addOption("-J")
                      req.addOption("--no-warnings")
                      val json = JSONObject(YoutubeDL.getInstance().execute(req).out)
                      val arr = json.optJSONArray("entries") ?: return out
                      for (i in 0 until arr.length()) {
                          val e = arr.optJSONObject(i) ?: continue
                          // flat: "url" video adresidir. flat değilse "url" ses akışıdır, sayfa adresi webpage_url'dir.
                          val url = if (flat) e.optString("url").ifEmpty { e.optString("webpage_url") }
                                    else e.optString("webpage_url").ifEmpty { e.optString("url") }
                          if (!url.startsWith("http")) continue
                          val th = e.optString("thumbnail").ifEmpty {
                              e.optJSONArray("thumbnails")?.optJSONObject(0)?.optString("url") ?: "" }
                          out.add(Song(url, e.optString("title"),
                              e.optString("uploader", e.optString("channel")),
                              e.optInt("duration"), th))
                      }
                  } catch (_: Exception) { }
                  return out
              }

              /** SoundCloud ve YouTube aynı anda aranır, sonuçlar sırayla karıştırılır. */
              fun search(ctx: Context, q: String): List<Song> {
                  init(ctx)
                  var sc: List<Song> = emptyList()
                  var yt: List<Song> = emptyList()
                  val t1 = Thread { sc = searchOne("scsearch6", q, false) }
                  val t2 = Thread { yt = searchOne("ytsearch8", q, true) }
                  t1.start(); t2.start(); t1.join(); t2.join()
                  val out = ArrayList<Song>()
                  for (i in 0 until maxOf(sc.size, yt.size)) {
                      if (i < sc.size) out.add(sc[i])
                      if (i < yt.size) out.add(yt[i])
                  }
                  return out
              }

              /** Botun radyosuyla aynı format: 128 kbps, 44.1 kHz, stereo MP3. */
              fun downloadMp3(ctx: Context, url: String): File {
                  init(ctx)
                  return try {
                      downloadOnce(ctx, url)
                  } catch (e: Exception) {
                      updateYtDlp(ctx, 10 * 60 * 1000L)
                      downloadOnce(ctx, url)
                  }
              }
              
              private fun downloadOnce(ctx: Context, url: String): File {
                  val dir = File(ctx.cacheDir, "songs").apply { mkdirs() }
                  val id = UUID.randomUUID().toString()
                  val req = YoutubeDLRequest(url)
                  req.addOption("-f", "bestaudio[abr<=160]/bestaudio/best")
                  req.addOption("--no-playlist")
                  req.addOption("-x")
                  req.addOption("--audio-format", "mp3")
                  req.addOption("--audio-quality", "128K")
                  req.addOption("--postprocessor-args", "ffmpeg:-ar 44100 -ac 2")
                  req.addOption("-o", File(dir, "$id.%(ext)s").absolutePath)
                  YoutubeDL.getInstance().execute(req)
                  val f = File(dir, "$id.mp3")
                  require(f.exists()) { "dosya oluşmadı" }
                  return f
              }

              fun upload(baseUrl: String, appKey: String, user: String, file: File,
                         title: String, thumb: String, jobId: String = ""): Pair<Int, String> {
                  val boundary = "----" + UUID.randomUUID()
                  val u = URL(baseUrl.trimEnd('/') + "/api/music/upload?user=" +
                      URLEncoder.encode(user, "UTF-8"))
                  val conn = (u.openConnection() as HttpURLConnection).apply {
                      requestMethod = "POST"
                      doOutput = true
                      connectTimeout = 20000
                      readTimeout = 120000
                      setChunkedStreamingMode(64 * 1024)
                      setRequestProperty("X-App-Key", appKey)
                      setRequestProperty("Content-Type", "multipart/form-data; boundary=$boundary")
                  }
                  DataOutputStream(conn.outputStream).use { o ->
                      fun field(n: String, v: String) {
                          o.writeBytes("--$boundary\r\nContent-Disposition: form-data; name=\"$n\"\r\n\r\n")
                          o.write(v.toByteArray(Charsets.UTF_8))
                          o.writeBytes("\r\n")
                      }
                      field("title", title)
                      field("thumb", thumb)
                      if (jobId.isNotEmpty()) field("job_id", jobId)
                      o.writeBytes("--$boundary\r\nContent-Disposition: form-data; name=\"file\"; " +
                          "filename=\"s.mp3\"\r\nContent-Type: audio/mpeg\r\n\r\n")
                      file.inputStream().use { it.copyTo(o, 64 * 1024) }
                      o.writeBytes("\r\n--$boundary--\r\n")
                  }
                  val code = conn.responseCode
                  val body = (if (code in 200..299) conn.inputStream else conn.errorStream)
                      ?.bufferedReader()?.readText() ?: ""
                  conn.disconnect()
                  return code to body
              }
          }
          __END5__
          mkdir -p "$(dirname 'app/src/main/java/com/rqtm/muzik/PollService.kt')"
          cat > 'app/src/main/java/com/rqtm/muzik/PollService.kt' <<'__END6__'
          package com.rqtm.muzik

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.net.wifi.WifiManager
          import android.os.PowerManager
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * Odada yazılan -p komutlarını bottan alır, aramayı/indirmeyi/MP3 çevirmeyi telefonda yapar,
           * bitmiş MP3'ü bota yükler. Telefon bota 2,5 sn'de bir sorar (bota bağlanan taraf telefon).
           */
          class PollService : Service() {
              @Volatile private var running = false
              private var thread: Thread? = null
              private var wake: PowerManager.WakeLock? = null
              private var wifi: WifiManager.WifiLock? = null

              private val prefs get() = getSharedPreferences("cfg", MODE_PRIVATE)
              private fun server() = (prefs.getString("server", "") ?: "").trimEnd('/')
              private fun key() = prefs.getString("key", "") ?: ""

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  val n = notif()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  else startForeground(1, n)
                  if (!running) {
                      running = true
                      wake = (getSystemService(POWER_SERVICE) as PowerManager)
                          .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "muzik:poll").apply { acquire() }
                      try {
                          @Suppress("DEPRECATION")
                          wifi = (applicationContext.getSystemService(WIFI_SERVICE) as WifiManager)
                              .createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "muzik:wifi").apply { acquire() }
                      } catch (_: Throwable) { }
                      thread = Thread { loop() }.also { it.start() }
                      Thread { LocalMusic.updateYtDlp(this, 6 * 60 * 60 * 1000L) }.start()
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  running = false
                  thread?.interrupt()
                  if (wake?.isHeld == true) wake?.release()
                  try { if (wifi?.isHeld == true) wifi?.release() } catch (_: Throwable) { }
                  super.onDestroy()
              }

              private var lastStatus = ""
              private fun status(t: String) {
                  if (t == lastStatus) return
                  lastStatus = t
                  try { (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).notify(1, notif(t)) }
                  catch (_: Throwable) { }
              }

              private fun notif(text: String = "جارٍ الاستماع لأوامر الغرفة"): Notification {
                  val ch = "poll"
                  if (Build.VERSION.SDK_INT >= 26) {
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                          .createNotificationChannel(NotificationChannel(ch, "الموسيقى", NotificationManager.IMPORTANCE_LOW))
                  }
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, ch) else Notification.Builder(this)
                  return b.setContentTitle("موسيقى الهاتف").setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_media_play).setOngoing(true).build()
              }

              private fun http(method: String, path: String, body: String? = null): Pair<Int, String> {
                  val c = (URL(server() + path).openConnection() as HttpURLConnection).apply {
                      requestMethod = method
                      connectTimeout = 15000; readTimeout = 20000
                      setRequestProperty("X-App-Key", key())
                      if (body != null) {
                          doOutput = true
                          setRequestProperty("Content-Type", "application/json")
                          outputStream.use { it.write(body.toByteArray()) }
                      }
                  }
                  val code = c.responseCode
                  val txt = (if (code in 200..299) c.inputStream else c.errorStream)?.bufferedReader()?.readText() ?: ""
                  c.disconnect()
                  return code to txt
              }

              private fun loop() {
                  while (running) {
                      try {
                          if (server().isEmpty() || key().isEmpty()) {
                              status("لم يتم إدخال عنوان البوت أو المفتاح")
                          } else {
                              val (code, body) = http("GET", "/api/music/jobs/next")
                              if (code == 200) {
                                  status("متصل، بانتظار الطلبات")
                                  val j = JSONObject(body)
                                  if (!j.isNull("job")) { handle(j); continue }
                              } else if (code == 403) status("مفتاح التطبيق خاطئ (403)")
                              else status("البوت أعاد خطأ ($code)")
                          }
                      } catch (_: InterruptedException) { return }
                      catch (e: Throwable) { status("تعذّر الاتصال بالبوت: " + (e.message ?: "").take(40)) }
                      try { Thread.sleep(2500) } catch (_: InterruptedException) { return }
                  }
              }

              private val bad = listOf("remix", "live", "cover", "karaoke", "slowed", "reverb", "sped up",
                  "nightcore", "8d", "instrumental", "full album", "playlist", "1 hour", "mix")

              private fun handle(j: JSONObject) {
                  val jobId = j.getString("job")
                  val q = j.getString("q")
                  val min = j.optInt("min_sec", 60)
                  val max = j.optInt("max_sec", 720)
                  var ok = false
                  try {
                      val all = LocalMusic.search(this, q).filter { it.duration == 0 || it.duration <= max }
                      val ql = q.lowercase()
                      val good = all.filter { s ->
                          (s.duration == 0 || s.duration >= min) &&
                              bad.none { b -> s.title.lowercase().contains(b) && !ql.contains(b) }
                      }
                      for (c in good.ifEmpty { all }.take(3)) {
                          try {
                              val f = LocalMusic.downloadMp3(this, c.url)
                              try {
                                  val r = LocalMusic.upload(server(), key(), "", f, c.title, c.thumb, jobId)
                                  if (r.first == 200) ok = true
                              } finally { f.delete() }
                          } catch (_: Exception) { }
                          if (ok) break
                      }
                  } catch (_: Exception) { }
                  if (!ok) {
                      try { http("POST", "/api/music/jobs/fail", JSONObject().put("job", jobId).toString()) }
                      catch (_: Exception) { }
                  }
              }
          }
          __END6__
          mkdir -p "$(dirname 'app/src/main/java/com/rqtm/muzik/MainActivity.kt')"
          cat > 'app/src/main/java/com/rqtm/muzik/MainActivity.kt' <<'__END7__'
          package com.rqtm.muzik

          import android.app.Activity
          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import android.os.Build
          import android.graphics.Color
          import android.os.Bundle
          import android.os.PowerManager
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import java.util.concurrent.Executors

          class MainActivity : Activity() {
              private val prefs by lazy { getSharedPreferences("cfg", MODE_PRIVATE) }
              // Şarkılar sırayla (ardı ardına) işlenir
              private val worker = Executors.newSingleThreadExecutor()
              private val searcher = Executors.newSingleThreadExecutor()
              private lateinit var status: TextView
              private lateinit var results: LinearLayout
              private var wake: PowerManager.WakeLock? = null
              private var pending = 0

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun edit(hint: String, key: String, pass: Boolean = false): EditText =
                  EditText(this).apply {
                      this.hint = hint
                      setText(prefs.getString(key, ""))
                      setSingleLine()
                      setTextColor(Color.WHITE); setHintTextColor(0xFF8899AA.toInt())
                      if (pass) inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFF111A22.toInt())
                      setPadding(dp(14), dp(36), dp(14), dp(10))
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }
                  val server = edit("عنوان البوت (http://...)", "server")
                  val key = edit("مفتاح التطبيق APP_KEY", "key", true)
                  val user = edit("اسم المستخدم في Highrise", "user")
                  val save = Button(this).apply { text = "حفظ" }
                  val listen = Button(this)
                  fun refreshListen() {
                      listen.text = if (prefs.getBoolean("listen", false))
                          "أوامر -p في الغرفة تعمل على هذا الهاتف: مفعّل (اضغط للإيقاف)"
                      else "أوامر -p في الغرفة تعمل على هذا الهاتف: متوقف (اضغط للتفعيل)"
                  }
                  fun setListen(on: Boolean) {
                      prefs.edit().putBoolean("listen", on).apply()
                      val it = Intent(this, PollService::class.java)
                      if (on) {
                          if (Build.VERSION.SDK_INT >= 33)
                              requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(it) else startService(it)
                      } else stopService(it)
                      refreshListen()
                  }
                  listen.setOnClickListener { setListen(!prefs.getBoolean("listen", false)) }
                  refreshListen()
                  if (prefs.getBoolean("listen", false)) {
                      val it = Intent(this, PollService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(it) else startService(it)
                  }
                  val pkg = Uri.parse("package:$packageName")
                  fun cmp(a: String, b: String) = Intent().setClassName(a, b)
                  // Verilen ekranları sırayla dener, hiçbiri açılmazsa uygulamanın genel ayarlarını açar
                  fun openFirst(vararg list: Intent) {
                      for (i in list) {
                          try { startActivity(i); return } catch (_: Throwable) { }
                      }
                      try { startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, pkg)) }
                      catch (_: Throwable) { toast("تعذّر فتح الإعدادات") }
                  }
                  fun settingsBtn(label: String, action: () -> Unit) = Button(this).apply {
                      text = label; setOnClickListener { action() }
                  }
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  val bBattery = settingsBtn("1) إزالة قيود البطارية") {
                      if (pm.isIgnoringBatteryOptimizations(packageName)) toast("قيود البطارية معطّلة بالفعل")
                      else openFirst(
                          Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, pkg),
                          Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                  }
                  val bAuto = settingsBtn("2) التشغيل التلقائي / العمل في الخلفية") {
                      openFirst(
                          cmp("com.miui.securitycenter", "com.miui.permcenter.autostart.AutoStartManagementActivity"),
                          cmp("com.coloros.safecenter", "com.coloros.safecenter.permission.startup.StartupAppListActivity"),
                          cmp("com.oppo.safe", "com.oppo.safe.permission.startup.StartupAppListActivity"),
                          cmp("com.vivo.permissionmanager", "com.vivo.permissionmanager.activity.BgStartUpManagerActivity"),
                          cmp("com.iqoo.secure", "com.iqoo.secure.ui.phoneoptimize.AddWhiteListActivity"),
                          cmp("com.huawei.systemmanager", "com.huawei.systemmanager.startupmgr.ui.StartupNormalAppListActivity"),
                          cmp("com.samsung.android.lool", "com.samsung.android.sm.ui.battery.BatteryActivity"))
                  }
                  val bData = settingsBtn("3) إذن البيانات غير المحدودة") {
                      openFirst(Intent(Settings.ACTION_IGNORE_BACKGROUND_DATA_RESTRICTIONS_SETTINGS, pkg))
                  }
                  val bNotif = settingsBtn("4) إذن الإشعارات") {
                      openFirst(Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS)
                          .putExtra(Settings.EXTRA_APP_PACKAGE, packageName))
                  }
                                    val bApp = settingsBtn("5) إعدادات التطبيق (البطارية، الأذونات)") {
                      openFirst(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, pkg))
                  }
                  val q = edit("ابحث عن أغنية...", "")
                  q.setText("")
                  val go = Button(this).apply { text = "بحث" }
                  status = TextView(this).apply { setTextColor(0xFFAAB6C2.toInt()); setPadding(0, dp(6), 0, dp(6)) }
                  results = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  save.setOnClickListener {
                      prefs.edit().putString("server", server.text.toString().trim())
                          .putString("key", key.text.toString().trim())
                          .putString("user", user.text.toString().trim().removePrefix("@")).apply()
                      toast("تم الحفظ")
                  }
                  val doSearch = {
                      val text = q.text.toString().trim()
                      if (text.length >= 2) {
                          (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager)
                              .hideSoftInputFromWindow(q.windowToken, 0)
                          search(text)
                      }
                  }
                  go.setOnClickListener { doSearch() }
                  q.setOnEditorActionListener { _, _, _ -> doSearch(); true }

                  root.addView(server); root.addView(key); root.addView(user); root.addView(save); root.addView(listen)
                  listOf(bBattery, bAuto, bData, bNotif, bApp).forEach { root.addView(it) }
                  val row = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  row.addView(q, LinearLayout.LayoutParams(0, -2, 1f)); row.addView(go)
                  root.addView(row); root.addView(status)
                  root.addView(results)
                  setContentView(ScrollView(this).apply {
                      isFillViewport = true
                      setBackgroundColor(0xFF111A22.toInt())
                      addView(root)
                  })
                  status.text = "جاهز. ابحث عن أغنية واضغط + للإضافة."
                  Thread { LocalMusic.updateYtDlp(this, 6 * 60 * 60 * 1000L) }.start()
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
              private fun ui(f: () -> Unit) = runOnUiThread { f() }

              private fun search(text: String) {
                  status.text = "جارٍ البحث..."
                  results.removeAllViews()
                  searcher.execute {
                      val list = try { LocalMusic.search(this, text) } catch (e: Exception) { null }
                      ui {
                          if (list == null) { status.text = "خطأ في البحث"; return@ui }
                          status.text = if (list.isEmpty()) "لا توجد نتائج" else ""
                          list.forEach { s -> results.addView(row(s)) }
                      }
                  }
              }

              private fun row(s: LocalMusic.Song): View {
                  val min = s.duration / 60; val sec = s.duration % 60
                  val t = TextView(this).apply {
                      text = s.title + "\n" + s.uploader + (if (s.duration > 0) "  ·  %d:%02d".format(min, sec) else "")
                      setTextColor(Color.WHITE); textSize = 14f
                      setPadding(dp(4), dp(10), dp(4), dp(10))
                  }
                  val add = Button(this).apply { text = "+" }
                  add.setOnClickListener { add.isEnabled = false; enqueue(s) }
                  return LinearLayout(this).apply {
                      gravity = Gravity.CENTER_VERTICAL
                      addView(t, LinearLayout.LayoutParams(0, -2, 1f)); addView(add)
                  }
              }

              private fun enqueue(s: LocalMusic.Song) {
                  val server = prefs.getString("server", "") ?: ""
                  val key = prefs.getString("key", "") ?: ""
                  val user = prefs.getString("user", "") ?: ""
                  if (server.isEmpty() || key.isEmpty() || user.isEmpty()) {
                      toast("احفظ عنوان البوت والمفتاح واسم المستخدم أولاً"); return
                  }
                  pending++
                  if (wake == null) {
                      wake = (getSystemService(POWER_SERVICE) as PowerManager)
                          .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "muzik:work")
                  }
                  if (wake?.isHeld == false) wake?.acquire(60 * 60 * 1000L)
                  ui { status.text = "قيد المعالجة: $pending أغنية..." }
                  worker.execute {
                      var msg: String
                      try {
                          val f = LocalMusic.downloadMp3(this, s.url)
                          try {
                              val r = LocalMusic.upload(server, key, user, f, s.title, s.thumb)
                              msg = when (r.first) {
                                  200 -> "تمت الإضافة: ${s.title.take(40)}"
                                  403 -> "لا توجد صلاحية (المفتاح خاطئ أو للمالك فقط)"
                                  404 -> "لا تظهر في الغرفة، تحقق من اسم المستخدم"
                                  400 -> "مرفوض (المدة/الصيغة): " + r.second.take(60)
                                  else -> "خطأ ${r.first}"
                              }
                          } finally { f.delete() }
                      } catch (e: Exception) {
                          msg = "فشل: " + (e.message ?: "غير معروف").take(80)
                      }
                      pending--
                      ui {
                          toast(msg)
                          status.text = if (pending > 0) "قيد المعالجة: $pending أغنية..." else msg
                          if (pending == 0 && wake?.isHeld == true) wake?.release()
                      }
                  }
              }
          }
          __END7__
